apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: omnidoc-backend
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/omnidoc-backend:latest
        resources:
          limits:
            cpu: "1000m"
            memory: "512Mi"
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: omnidoc-secret-key
              key: latest
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: omnidoc-database-url
              key: latest
        - name: STORAGE_PROVIDER
          value: "supabase"
        - name: SUPABASE_URL
          value: "https://kflqymlcrtqepwjeulpb.supabase.co"
        - name: SUPABASE_SERVICE_ROLE_KEY
          valueFrom:
            secretKeyRef:
              name: omnidoc-supabase-service-role-key
              key: latest
        - name: SUPABASE_BUCKET_NAME
          value: "documents"
        - name: FRONTEND_URL
          value: "https://omnidoc-studio-jet.vercel.app"
        - name: ENABLE_STRIPE
          value: "false"
        - name: TRUST_PROXY_HEADERS
          value: "true"
