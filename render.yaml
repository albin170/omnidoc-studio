services:
  - type: web
    name: omnidoc-fastapi-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    disk:
      name: omnidoc-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://omnidoc-studio-jet.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        fromDatabase:
          name: omnidoc-postgres
          property: connectionString
      - key: STORAGE_DIR
        value: "/data/storage_vault"

databases:
  - name: omnidoc-postgres
    databaseName: omnidoc_studio
    user: omnidoc_admin
    plan: standard
