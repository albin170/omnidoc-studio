# Render configuration using Supabase as database and storage provider.
# Set the three sync:false values in the Render dashboard; never commit their values.
services:
  - type: web
    name: omnidoc-fastapi-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://omnidoc-studio-jet.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        value: "https://kflqymlcrtqepwjeulpb.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: documents
      - key: ENABLE_STRIPE
        value: "false"
